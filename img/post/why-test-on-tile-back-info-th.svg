<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Chakra Petch','Anuphan','Loma','Laksaman',sans-serif">
<rect width="1200" height="900" fill="#F2F2EF"/>
<rect x="1.5" y="1.5" width="1197" height="897" fill="none" stroke="#DCDCD6" stroke-width="3" rx="18"/>
<text x="60" y="52" font-size="17" letter-spacing="3" fill="#D8571C" font-weight="600">LUCERNAPRO · CASE STUDY</text>
<text x="60" y="100" font-size="33" font-weight="700" fill="#191C1F">หลังกระเบื้อง  vs  ปูนหน้างาน — สนามทดสอบต่างกันตรงไหน</text>
<text x="60" y="136" font-size="19.5" fill="#5E646A">สีจะเกาะหรือลอก พื้นผิวเป็นคนตัดสินครึ่งหนึ่งเสมอ — เริ่มทดสอบบนสนามที่ตัวแปรกวนเป็นศูนย์ก่อน</text>

<rect x="60" y="172" width="520" height="440" rx="14" fill="#FFFFFF" stroke="#DCDCD6" stroke-width="2"/>
<circle cx="94" cy="206" r="16" fill="#2F9760"/>
<path d="M 87 206 l 5 5 l 9 -10" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="118" y="212" font-size="19" font-weight="700" fill="#2F9760">หลังกระเบื้อง (ด้านหยาบ ไม่เคลือบ)</text>
<path d="M 110 306 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 0 74 l -400 0 Z" fill="#D9C29B" stroke="#A6835A" stroke-width="2"/>
<path d="M 110 306 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9 l 20 9 l 20 -9" stroke="#4FB7E8" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="200" cy="335" r="2.5" fill="#B79A6C"/><circle cx="260" cy="352" r="2.5" fill="#B79A6C"/><circle cx="330" cy="330" r="2.5" fill="#B79A6C"/><circle cx="400" cy="350" r="2.5" fill="#B79A6C"/><circle cx="460" cy="332" r="2.5" fill="#B79A6C"/>
<text x="320" y="365" font-size="14.5" fill="#8A6A3E" text-anchor="middle">เนื้อเซรามิกเผาแล้ว — นิ่ง แห้ง เสถียร</text>
<line x1="240" y1="288" x2="240" y2="252" stroke="#1E6E96" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="240" y="242" font-size="15" font-weight="600" fill="#1E6E96" text-anchor="middle">ฟิล์มสีกัดลงร่องผิวพรุนเต็มหน้า</text>
<circle cx="96" cy="428" r="9" fill="#2F9760"/><path d="M 91.5 428 l 3.5 3.5 l 6 -7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="434" font-size="17" fill="#191C1F">ผิวพรุนหยาบ ใกล้ปูนดิบที่สุด</text>
<circle cx="96" cy="470" r="9" fill="#2F9760"/><path d="M 91.5 470 l 3.5 3.5 l 6 -7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="476" font-size="17" fill="#191C1F">ไม่มีความชื้นแฝงดันจากข้างใต้</text>
<circle cx="96" cy="512" r="9" fill="#2F9760"/><path d="M 91.5 512 l 3.5 3.5 l 6 -7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="518" font-size="17" fill="#191C1F">ไม่มีความด่างรบกวนระดับเคมี</text>
<circle cx="96" cy="554" r="9" fill="#2F9760"/><path d="M 91.5 554 l 3.5 3.5 l 6 -7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="560" font-size="17" fill="#191C1F">ไม่มีฝุ่นผงปูนคั่นระหว่างสีกับผิว</text>
<text x="90" y="596" font-size="17" font-weight="700" fill="#2F9760">ตัวแปรกวน = 0  →  ผลทดสอบวัดเนื้อสีล้วนๆ</text>

<rect x="620" y="172" width="520" height="440" rx="14" fill="#FFFFFF" stroke="#DCDCD6" stroke-width="2"/>
<circle cx="654" cy="206" r="16" fill="#A8433A"/>
<text x="654" y="212" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="678" y="212" font-size="19" font-weight="700" fill="#A8433A">ปูนหน้างาน (แต่ละที่ไม่เหมือนกัน)</text>
<rect x="670" y="300" width="400" height="80" fill="#E4E3DD" stroke="#B9B9B1" stroke-width="2"/>
<path d="M 670 300 L 870 300" stroke="#4FB7E8" stroke-width="10" fill="none" stroke-linecap="round"/>
<path d="M 870 300 q 30 -26 60 0" stroke="#4FB7E8" stroke-width="10" fill="none" stroke-linecap="round"/>
<path d="M 930 300 L 1070 300" stroke="#4FB7E8" stroke-width="10" fill="none" stroke-linecap="round"/>
<line x1="875" y1="298" x2="1065" y2="298" stroke="#C9BFA8" stroke-width="3" stroke-dasharray="3 5"/>
<path d="M 826 336 q -5 10 0 16 q 8 -6 0 -16" fill="#4FA3D1"/>
<path d="M 906 336 q -5 10 0 16 q 8 -6 0 -16" fill="#4FA3D1"/>
<path d="M 826 366 l 0 -14 m -5 6 l 5 -6 l 5 6" stroke="#1E6E96" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 906 366 l 0 -14 m -5 6 l 5 -6 l 5 6" stroke="#1E6E96" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="985" y="352" font-size="15" font-weight="600" fill="#8A6A3E">pH สูง</text>
<line x1="900" y1="282" x2="960" y2="238" stroke="#A8433A" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="900" cy="282" r="3.5" fill="#A8433A"/>
<text x="968" y="234" font-size="15.5" font-weight="600" fill="#A8433A">ฟิล์มพองตรงจุดที่มองไม่เห็นล่วงหน้า</text>
<line x1="740" y1="296" x2="700" y2="252" stroke="#8A6A3E" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="740" cy="296" r="3.5" fill="#8A6A3E"/>
<text x="668" y="242" font-size="15" font-weight="600" fill="#8A6A3E">ชั้นฝุ่นผงปูนบางๆ คั่นอยู่</text>
<circle cx="656" cy="428" r="9" fill="#A8433A"/><text x="656" y="433" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="676" y="434" font-size="17" fill="#191C1F">ความชื้นสะสม — ดันฟิล์มจากข้างล่าง</text>
<circle cx="656" cy="470" r="9" fill="#A8433A"/><text x="656" y="475" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="676" y="476" font-size="17" fill="#191C1F">ความด่างของปูน — กวนการยึดเกาะระดับเคมี</text>
<circle cx="656" cy="512" r="9" fill="#A8433A"/><text x="656" y="517" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="676" y="518" font-size="17" fill="#191C1F">ฝุ่นผงปูนผิวหน้า — สีเกาะฝุ่น ไม่ถึงเนื้อปูนจริง</text>
<text x="650" y="560" font-size="16" fill="#5E646A">สามตัวนี้มองไม่เห็นด้วยตา และต่างกันทุกหน้างาน</text>
<text x="650" y="596" font-size="17" font-weight="700" fill="#A8433A">สีดีแค่ไหน ก็แพ้พื้นผิวที่มีปัญหาได้</text>

<rect x="60" y="640" width="1080" height="210" rx="14" fill="#FFFFFF" stroke="#DCDCD6" stroke-width="2"/>
<text x="90" y="684" font-size="20" font-weight="700" fill="#191C1F">ตรรกะการวินิจฉัย — ทดสอบครั้งเดียว อ่านผลได้ตลอดชีวิตงาน</text>
<rect x="90" y="712" width="300" height="104" rx="10" fill="#F2F2EF" stroke="#DCDCD6" stroke-width="1.5"/>
<text x="110" y="744" font-size="15" letter-spacing="2" fill="#D8571C" font-weight="600">STEP 1</text>
<text x="110" y="772" font-size="17" font-weight="700" fill="#191C1F">ทาบนหลังกระเบื้อง</text>
<text x="110" y="798" font-size="15" fill="#5E646A">รอเซ็ตตัวเต็มที่ แล้วแช่น้ำทดสอบ</text>
<path d="M 400 764 l 34 0 m -10 -8 l 10 8 l -10 8" stroke="#D8571C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="444" y="712" width="300" height="104" rx="10" fill="#F2F2EF" stroke="#DCDCD6" stroke-width="1.5"/>
<text x="464" y="744" font-size="15" letter-spacing="2" fill="#2F9760" font-weight="600">ผ่าน = พิสูจน์แล้ว</text>
<text x="464" y="772" font-size="17" font-weight="700" fill="#191C1F">เนื้อสีทำงานจริง 100%</text>
<text x="464" y="798" font-size="15" fill="#5E646A">เกาะแน่น ไม่พอง ไม่ลอก แกะไม่ออก</text>
<path d="M 754 764 l 34 0 m -10 -8 l 10 8 l -10 8" stroke="#D8571C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="798" y="712" width="312" height="104" rx="10" fill="#F2F2EF" stroke="#DCDCD6" stroke-width="1.5"/>
<text x="818" y="744" font-size="15" letter-spacing="2" fill="#A8433A" font-weight="600">ถ้าหน้างานมีปัญหา</text>
<text x="818" y="772" font-size="17" font-weight="700" fill="#191C1F">ต้นเหตุ = พื้นผิว ไม่ใช่สี</text>
<text x="818" y="798" font-size="15" fill="#5E646A">กลับไปแก้การเตรียมผิว — ตรงจุด ไม่หลงทาง</text>
</svg>
