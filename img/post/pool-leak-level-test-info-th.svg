<text x="116" y="222" font-size="21" fill="#5E646A">ระดับน้ำปกติ</text>
<line x1="560" y1="238" x2="560" y2="282" stroke="#D8571C" stroke-width="4"/>
<path d="M 552 276 L 560 290 L 568 276 Z" fill="#D8571C"/>
<text x="574" y="266" font-size="21" fill="#D8571C" font-weight="600">ปล่อยให้ระดับลดเอง</text>
<text x="116" y="326" font-size="22" font-weight="700" fill="#1E6E96">น้ำหยุดนิ่งที่นี่</text>
<rect x="38" y="206" width="62" height="52" fill="#F2F2EF" stroke="#B9B9B1" stroke-width="2"/>
<rect x="94" y="216" width="10" height="32" fill="#F2F2EF"/>
<text x="38" y="194" font-size="20" fill="#191C1F" font-weight="600">Skimmer</text>
<circle cx="107" cy="336" r="11" fill="#FFFFFF" stroke="#5E646A" stroke-width="2.5"/>
<circle cx="107" cy="336" r="3.5" fill="#5E646A"/>
<text x="130" y="343" font-size="20" fill="#5E646A">หัวจ่ายน้ำ (Return)</text>
<circle cx="712" cy="452" r="17" fill="#FFF3C4" stroke="#B9B9B1" stroke-width="2.5"/>
<circle cx="712" cy="452" r="7" fill="#E8B93A"/>
<text x="680" y="459" font-size="20" fill="#5E646A" text-anchor="end">ไฟใต้น้ำ</text>
<rect x="380" y="652" width="60" height="8" fill="#FFFFFF" stroke="#5E646A" stroke-width="2.5"/>
<line x1="392" y1="652" x2="392" y2="660" stroke="#5E646A" stroke-width="2"/>
<line x1="410" y1="652" x2="410" y2="660" stroke="#5E646A" stroke-width="2"/>
<line x1="428" y1="652" x2="428" y2="660" stroke="#5E646A" stroke-width="2"/>
<text x="410" y="694" font-size="20" fill="#5E646A" text-anchor="middle">สะดือสระ (Main Drain)</text>
<line x1="744" y1="292" x2="790" y2="292" stroke="#D8571C" stroke-width="2" stroke-dasharray="3 6"/>
<circle cx="808" cy="292" r="20" fill="#D8571C"/>
<text x="808" y="300" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
<text x="842" y="290" font-size="25" font-weight="700" fill="#191C1F">หยุดแถวปาก Skimmer</text>
<text x="842" y="322" font-size="20.5" fill="#5E646A">รั่วที่ตัว Skimmer หรือแนวท่อระดับนี้</text>
<line x1="744" y1="452" x2="790" y2="452" stroke="#D8571C" stroke-width="2" stroke-dasharray="3 6"/>
<circle cx="808" cy="452" r="20" fill="#D8571C"/>
<text x="808" y="460" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="842" y="450" font-size="25" font-weight="700" fill="#191C1F">หยุดที่ระดับไฟใต้น้ำ</text>
<text x="842" y="482" font-size="20.5" fill="#5E646A">รั่วรอบกล่องไฟ (Niche) หรือแนวเดินสาย</text>
<line x1="744" y1="648" x2="790" y2="648" stroke="#D8571C" stroke-width="2" stroke-dasharray="3 6"/>
<circle cx="808" cy="648" r="20" fill="#D8571C"/>
<text x="808" y="656" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
<text x="842" y="646" font-size="25" font-weight="700" fill="#191C1F">ลดจนเกือบแห้งก้นสระ</text>
<text x="842" y="678" font-size="20.5" fill="#5E646A">รั่วที่พื้นสระ หรือท่อสะดือสระ</text>
<rect x="60" y="742" width="1080" height="108" rx="14" fill="#FFFFFF" stroke="#DCDCD6" stroke-width="2"/>
<rect x="60" y="742" width="8" height="108" rx="4" fill="#D8571C"/>
<text x="92" y="788" font-size="24" fill="#191C1F">หลักฟิสิกส์ง่ายๆ: น้ำที่อยู่ต่ำกว่ารูรั่ว ไม่มีแรงดันดันออกไปไหน</text>
<text x="92" y="824" font-size="24" font-weight="700" fill="#D8571C">ระดับที่น้ำหยุดนิ่ง = ระดับของจุดรั่ว — ไล่หาแค่แนวนั้นแนวเดียวพอ</text>
</svg>