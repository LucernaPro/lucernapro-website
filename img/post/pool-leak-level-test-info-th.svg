<rect x="100" y="292" width="620" height="368" fill="#4FA3D1" opacity="0.30"/>
<path d="M 100 292 q 20 -8 40 0 q 20 8 40 0 q 20 -8 40 0 q 20 8 40 0 q 20 -8 40 0 q 20 8 40 0 q 20 -8 40 0 q 20 8 40 0 q 20 -8 40 0 q 20 8 40 0 q 20 -8 40 0 q 20 8 40 0 q 20 -8 40 0 q 20 8 40 0 q 20 -8 40 0 q 20 8 40 0" fill="none" stroke="#4FA3D1" stroke-width="3.5" clip-path="url(#poolclip)"/>
