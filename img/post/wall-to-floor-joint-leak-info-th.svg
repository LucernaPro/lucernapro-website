<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Chakra Petch','Anuphan','Loma','Laksaman',sans-serif">
<rect width="1200" height="900" fill="#F2F2EF"/>
<rect x="1.5" y="1.5" width="1197" height="897" fill="none" stroke="#DCDCD6" stroke-width="3" rx="18"/>
<text x="60" y="52" font-size="17" letter-spacing="3" fill="#D8571C" font-weight="600">LUCERNAPRO · CASE STUDY</text>
<text x="60" y="100" font-size="33" font-weight="700" fill="#191C1F">ทาทับมุมฉากตรงๆ  vs  โป๊วมุมให้โค้งก่อน</text>
<text x="60" y="136" font-size="19.5" fill="#5E646A">มุมฉากคือจุดอ่อนตามธรรมชาติของฟิล์มกันซึม — ต้องเปลี่ยนให้เป็นมุมโค้งก่อนเคลือบเสมอ</text>
<rect x="60" y="190" width="520" height="520" rx="14" fill="#FFFFFF" stroke="#DCDCD6" stroke-width="2"/>
<circle cx="94" cy="224" r="16" fill="#A8433A"/>
<text x="94" y="230" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">✕</text>
<text x="118" y="230" font-size="19" font-weight="700" fill="#A8433A">ผิดวิธี — ทาทับตรงมุม</text>
<rect x="120" y="280" width="80" height="260" fill="#E4E3DD" stroke="#B9B9B1" stroke-width="2"/>
<rect x="200" y="540" width="300" height="70" fill="#E4E3DD" stroke="#B9B9B1" stroke-width="2"/>
<text x="160" y="310" font-size="15" fill="#5E646A" text-anchor="middle">ผนัง</text>
<text x="460" y="585" font-size="15" fill="#5E646A" text-anchor="middle">พื้น</text>
<path d="M 200 280 L 200 534" stroke="#4FA3D1" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M 206 540 L 500 540" stroke="#4FA3D1" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M 200 534 L 206 540" stroke="#4FA3D1" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M 190 536 l 9 10 l -9 10 l 9 9" stroke="#A8433A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 198 548 q 18 22 45 30" stroke="#1E6E96" stroke-width="2.5" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/>
<circle cx="252" cy="582" r="7" fill="#4FA3D1" opacity="0.55"/>
<text x="270" y="587" font-size="14.5" fill="#1E6E96">น้ำซึมลงใต้ฟิล์ม</text>
<line x1="214" y1="510" x2="360" y2="340" stroke="#A8433A" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="214" cy="510" r="3.5" fill="#A8433A"/>
<text x="360" y="332" font-size="16.5" font-weight="600" fill="#A8433A">ฟิล์มบางสุดตรงนี้ + จุดรวมแรง</text>
<text x="90" y="680" font-size="16" font-weight="600" fill="#A8433A">รอยแตกเกิดซ้ำที่เส้นเดิมทุกครั้ง</text>
<rect x="620" y="190" width="520" height="520" rx="14" fill="#FFFFFF" stroke="#DCDCD6" stroke-width="2"/>
<circle cx="654" cy="224" r="16" fill="#2F9760"/>
<text x="654" y="230" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
<text x="678" y="230" font-size="19" font-weight="700" fill="#2F9760">ถูกวิธี — โป๊วมุมให้โค้งก่อน</text>
<rect x="680" y="280" width="80" height="260" fill="#E4E3DD" stroke="#B9B9B1" stroke-width="2"/>
<rect x="760" y="540" width="300" height="70" fill="#E4E3DD" stroke="#B9B9B1" stroke-width="2"/>
<text x="720" y="310" font-size="15" fill="#5E646A" text-anchor="middle">ผนัง</text>
<text x="1020" y="585" font-size="15" fill="#5E646A" text-anchor="middle">พื้น</text>
<path d="M 760 510 A 30 30 0 0 1 790 540 L 760 540 Z" fill="#D9C29B" stroke="#A6835A" stroke-width="1.5"/>
<path d="M 760 280 L 760 510" stroke="#4FA3D1" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M 760 510 A 30 30 0 0 1 790 540" stroke="#4FA3D1" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M 790 540 L 1060 540" stroke="#4FA3D1" stroke-width="9" fill="none" stroke-linecap="round"/>
<text x="768" y="502" font-size="13" fill="#8A6A3E">โป๊วมุม (Fillet)</text>
<circle cx="774" cy="485" r="10" fill="#2F9760"/>
<path d="M 769 485 l 4 4 l 7 -8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="784" y1="485" x2="920" y2="340" stroke="#2F9760" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="920" y="332" font-size="16.5" font-weight="600" fill="#2F9760">ฟิล์มหนาสม่ำเสมอตลอดแนว</text>
<path d="M 700 272 L 700 256" stroke="#4FA3D1" stroke-width="1.5"/>
<path d="M 695 262 L 700 254 L 705 262" stroke="#4FA3D1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="714" y="267" font-size="13.5" fill="#5E646A">ทาต่อเนื่องขึ้นผนัง</text>
<line x1="955" y1="578" x2="1035" y2="578" stroke="#4FA3D1" stroke-width="1.5"/>
<path d="M 1025 573 L 1035 578 L 1025 583" stroke="#4FA3D1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="778" y="582" font-size="13.5" fill="#5E646A">ทาต่อเนื่องข้ามมุมเสมอ</text>
<text x="650" y="680" font-size="16" font-weight="600" fill="#2F9760">มุมโค้งไม่มีจุดให้รอยแตกเลือกเกิดซ้ำ</text>
<rect x="60" y="730" width="1080" height="110" rx="14" fill="#FFFFFF" stroke="#DCDCD6" stroke-width="2"/>
<rect x="60" y="730" width="8" height="110" rx="4" fill="#D8571C"/>
<text x="92" y="776" font-size="22" fill="#191C1F">หลักการเดียวเท่านั้น: เปลี่ยนมุมฉากให้เป็นมุมโค้งก่อนเคลือบทุกครั้ง</text>
<text x="92" y="812" font-size="22" font-weight="700" fill="#D8571C">ฟิล์มที่โค้งไปกับพื้นผิวไม่มีจุดให้แรงจากการขยับตัวไปกระจุกที่เดียว</text>
</svg>