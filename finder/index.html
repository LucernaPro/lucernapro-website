<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ภารกิจตามหาอาวุธลับ | LucernaPro</title>
<meta name="description" content="ตอบไม่กี่ข้อ หยดหยดจะพาไปเจออาวุธลับที่ใช่สำหรับบ้านคุณ — เกมเลือกสินค้าโดย LucernaPro">
<link rel="canonical" href="https://www.lucernapro.com/finder">
<script src="/track.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Anuphan:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#071B33;
    --deep2:#0E3557;
    --sky1:#8ED8F8;
    --sky2:#DFF4FE;
    --ink:#0B2239;
    --aqua:#45C6F0;
    --aqua-soft:#8FD8FF;
    --gold:#FFC53D;
    --gold-deep:#C98F00;
    --cta:#FF8A3D;
    --cta-deep:#E86F1F;
    --dlg:#12365C;
    --ok:#18A05E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;}
  body{
    font-family:'Anuphan',sans-serif;
    background:var(--deep);
    color:#EAF6FF;
    display:flex;justify-content:center;
    overflow:hidden;
  }
  .app{
    width:100%;max-width:480px;height:100vh;height:100dvh;
    position:relative;overflow:hidden;
  }
  .screen{
    position:absolute;inset:0;
    display:none;flex-direction:column;
  }
  .screen.active{display:flex;animation:scrIn .4s ease both;}
  @keyframes scrIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* ============ shared: progress droplets ============ */
  .prog{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;z-index:40;
  }
  .prog span{font-size:15px;opacity:.25;transition:all .3s ease;filter:grayscale(1);}
  .prog span.on{opacity:1;filter:none;transform:scale(1.15);}

  /* ============ shared: skip / back ============ */
  .chip-btn{
    position:absolute;top:12px;z-index:50;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.25);
    color:#CFE9F8;
    font-family:'Mitr',sans-serif;font-size:15.5px;font-weight:500;
    padding:9px 20px;border-radius:999px;cursor:pointer;
  }
  .chip-btn:active{background:rgba(255,255,255,.22);}
  .chip-btn.right{right:14px;}
  .chip-btn.left{left:14px;}
  .light .chip-btn{
    background:rgba(11,34,57,.08);border-color:rgba(11,34,57,.18);color:var(--ink);
  }

  /* ================================================================
     SCREEN 1 : TITLE
     ================================================================ */
  #scrTitle{
    background:radial-gradient(circle at 50% 115%, var(--deep2), var(--deep) 65%);
    align-items:center;justify-content:center;
  }
  .bubble{
    position:absolute;bottom:-30px;border-radius:50%;
    border:1.5px solid rgba(143,216,255,.35);
    background:rgba(143,216,255,.06);
    animation:rise linear infinite;pointer-events:none;
  }
  @keyframes rise{
    from{transform:translateY(0);opacity:0}
    10%{opacity:1}
    to{transform:translateY(-110vh) translateX(18px);opacity:0}
  }
  .falling-drop{
    position:absolute;top:-60px;left:50%;width:34px;height:44px;
    transform:translateX(-50%);
    animation:fall .9s .4s cubic-bezier(.55,0,.85,.36) forwards;z-index:6;
  }
  @keyframes fall{to{top:calc(52% - 44px);}}
  .splash-ring{
    position:absolute;top:52%;left:50%;
    width:20px;height:8px;border:3px solid var(--aqua);border-radius:50%;
    transform:translate(-50%,-50%) scale(0);opacity:0;
    animation:ringOut .55s 1.28s ease-out forwards;z-index:5;
  }
  .splash-ring.r2{animation-delay:1.38s;border-color:var(--aqua-soft);}
  @keyframes ringOut{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}
    100%{transform:translate(-50%,-50%) scale(6);opacity:0}
  }
  .spark{
    position:absolute;top:52%;left:50%;font-size:14px;opacity:0;z-index:6;pointer-events:none;
    animation:sparkFly .6s 1.28s ease-out forwards;
  }
  @keyframes sparkFly{
    0%{transform:translate(-50%,-50%);opacity:1}
    100%{transform:translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(.4);opacity:0}
  }
  .title-mascot{
    width:clamp(140px,20vh,205px);height:auto;aspect-ratio:100/110;margin-top:1vh;
    transform:translateY(40px) scale(0);
    animation:popUp .55s 1.35s cubic-bezier(.34,1.56,.64,1) forwards;z-index:7;
  }
  @keyframes popUp{to{transform:translateY(0) scale(1);}}
  .title-mascot svg{width:100%;height:100%;overflow:visible;}
  .mascot-idle{animation:idle 3s 2.6s ease-in-out infinite;transform-origin:50% 92%;}
  @keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
  .hat{transform:translateY(-90px);opacity:0;animation:hatDrop .35s 2.0s cubic-bezier(.55,0,.85,.36) forwards;}
  @keyframes hatDrop{0%{transform:translateY(-90px);opacity:1}80%{transform:translateY(4px)}100%{transform:translateY(0);opacity:1}}
  .hat-star{opacity:0;transform-origin:center;transform-box:fill-box;animation:starPing .5s 2.35s ease-out forwards;}
  @keyframes starPing{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.6) rotate(40deg)}}
  .arm-wave{transform-origin:78px 62px;animation:wave .7s 2.5s ease-in-out 2;}
  @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
  .presents{
    font-family:'Mitr',sans-serif;font-weight:500;font-size:14.5px;
    letter-spacing:3px;color:var(--aqua-soft);opacity:0;
    animation:fadeUp .5s 2.7s ease forwards;
  }
  .presents i{font-style:italic;}
  .game-title{
    font-family:'Mitr',sans-serif;font-weight:600;
    font-size:clamp(30px,9vw,46px);line-height:1.3;text-align:center;margin-top:6px;
    color:#fff;text-shadow:0 0 24px rgba(69,198,240,.45);
    opacity:0;transform:scale(1.4);
    animation:stampIn .45s 3.0s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .game-title .hl{color:var(--gold);}
  @keyframes stampIn{to{opacity:1;transform:scale(1)}}
  .press-start{
    margin-top:4vh;
    font-family:'Mitr',sans-serif;font-weight:600;font-size:21px;color:var(--gold);
    letter-spacing:1px;opacity:0;display:flex;align-items:center;gap:10px;
    animation:fadeUp .4s 3.5s ease forwards, blink 1.2s 3.9s step-end infinite;
  }
  @keyframes blink{50%{opacity:.15}}

  /* ============ RPG dialogue ============ */
  .dlg-wrap{position:absolute;left:14px;right:14px;bottom:20px;z-index:20;display:none;}
  #scrTitle .dlg-wrap{position:static;left:auto;right:auto;bottom:auto;width:min(456px,100%);padding:0 16px;margin-top:3vh;}
  .dlg{
    background:var(--dlg);
    border:3px solid var(--aqua);
    border-radius:18px;
    padding:18px 20px 16px;min-height:92px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative;
    animation:fadeUp .35s ease both;
  }
  .dlg .nametag{
    position:absolute;top:-15px;left:16px;
    background:var(--gold);color:#5C3A00;
    font-family:'Mitr',sans-serif;font-weight:600;font-size:14.5px;
    padding:3px 14px;border-radius:999px;border:2px solid #fff;
  }
  .dlg .txt{font-size:20px;line-height:1.65;font-weight:500;min-height:66px;color:#EAF6FF;}
  .dlg .next-hint{
    position:absolute;right:14px;bottom:8px;color:var(--aqua);font-size:14px;
    animation:nod 1s ease-in-out infinite;
  }
  @keyframes nod{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.3;transform:translateY(3px)}}
  @keyframes talkB{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  /* ================================================================
     SCREEN 2 : HOUSE (point & click)
     ================================================================ */
  #scrHouse{
    background:linear-gradient(180deg,var(--sky1),var(--sky2) 58%,#CBE9C9 58.2%,#B9DFB6);
    color:var(--ink);
  }
  .house-scene{
    flex:1;display:flex;align-items:center;justify-content:center;min-height:0;
    padding-top:44px;
  }
  .house-scene svg{width:100%;height:100%;max-height:60vh;}
  .hs{cursor:pointer;}
  .hs .ring{
    fill:none;stroke:#0E7CC4;stroke-width:2;opacity:0;
    animation:ring 1.8s ease-out infinite;
    transform-origin:center;transform-box:fill-box;
  }
  @keyframes ring{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.8);opacity:0}}
  .hs .drop-ic{
    animation:bob 1.6s ease-in-out infinite;
    transform-box:fill-box;transform-origin:center;
    filter:drop-shadow(0 2px 3px rgba(11,34,57,.3));
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .hs:active .drop-ic{transform:scale(.85);}
  .other-chip{
    position:absolute;bottom:calc(20px + 148px + 12px);right:14px;z-index:21;
    background:#fff;border:1.5px solid #D5E4EF;color:var(--ink);
    font-family:'Mitr',sans-serif;font-weight:500;font-size:15px;
    padding:10px 18px;border-radius:999px;cursor:pointer;
    box-shadow:0 3px 10px rgba(11,34,57,.12);
  }
  .house-mascot{
    position:absolute;top:-62px;left:4px;
    width:76px;height:84px;z-index:22;pointer-events:none;
  }
  #scrHouse .dlg .nametag{left:88px;}
  #scrHouse .dlg .txt{padding-left:68px;}
  .house-mascot svg{width:100%;height:100%;overflow:visible;}
  .splash{
    position:fixed;pointer-events:none;font-size:18px;z-index:60;
    animation:splashFly .6s ease-out forwards;
  }
  @keyframes splashFly{
    from{opacity:1;transform:translate(0,0) scale(1)}
    to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}
  }
  .go-btn{
    display:none;margin:12px auto 0;
    font-family:'Mitr',sans-serif;font-weight:600;font-size:17.5px;
    background:linear-gradient(180deg,var(--cta),var(--cta-deep));
    color:#fff;border:2px solid #fff;
    padding:10px 30px;border-radius:999px;cursor:pointer;
    box-shadow:0 5px 14px rgba(232,111,31,.4);
    animation:fadeUp .3s ease both;
  }
  .go-btn.show{display:block;}

  /* ================================================================
     SCREEN 3 : QUESTION
     ================================================================ */
  #scrQuestion{
    background:radial-gradient(circle at 50% 110%, var(--deep2), var(--deep) 70%);
    align-items:center;justify-content:center;padding:0 20px;
  }
  .q-mascot{width:82px;height:90px;margin-bottom:6px;}
  .q-mascot svg{width:100%;height:100%;overflow:visible;}
  .q-title{
    font-family:'Mitr',sans-serif;font-weight:600;
    font-size:clamp(25px,7.2vw,32px);line-height:1.4;text-align:center;
    margin-bottom:26px;
  }
  .q-opts{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px;}
  .q-opt{
    display:flex;align-items:center;gap:16px;
    background:rgba(255,255,255,.06);
    border:2px solid rgba(143,216,255,.35);
    border-radius:18px;
    padding:18px 18px;cursor:pointer;color:#EAF6FF;
    font-family:'Mitr',sans-serif;font-weight:500;font-size:21.5px;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
    animation:fadeUp .4s ease both;
  }
  .q-opt:nth-child(1){animation-delay:.05s}
  .q-opt:nth-child(2){animation-delay:.12s}
  .q-opt:nth-child(3){animation-delay:.19s}
  .q-opt .ic{font-size:34px;}
  .q-opt:active{transform:scale(.96);}
  @media(hover:hover){.q-opt:hover{border-color:var(--aqua);background:rgba(69,198,240,.10);}}
  .q-opt.picked{
    border-color:var(--gold);background:rgba(255,197,61,.14);
    animation:pop .3s ease;
  }
  .q-opt.dimmed{opacity:.3;pointer-events:none;}
  @keyframes pop{50%{transform:scale(1.05)}}

  /* ================================================================
     SCREEN 4 : REVEAL (gacha)
     ================================================================ */
  #scrReveal{
    background:radial-gradient(circle at 50% 40%, #14406B, var(--deep) 75%);
    align-items:center;justify-content:center;padding:0 18px;
    perspective:1000px;
  }
  .rays{
    position:absolute;top:44%;left:50%;width:520px;height:520px;
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,
      rgba(255,197,61,.16) 0deg 12deg, transparent 12deg 30deg);
    border-radius:50%;
    opacity:0;pointer-events:none;
    animation:raysSpin 14s linear infinite;
    transition:opacity .5s ease;
  }
  .rays.on{opacity:1;}
  @keyframes raysSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .card3d{
    width:min(330px,88vw);
    height:min(510px,74vh);
    position:relative;z-index:10;
    transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.4,0,.2,1);
    cursor:pointer;
  }
  .card3d.flipped{transform:rotateY(180deg);cursor:default;}
  .card-face{
    position:absolute;inset:0;
    border-radius:22px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  .card-back{
    background:linear-gradient(160deg,#123A63,#0B2745);
    border:3px solid var(--gold);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    animation:cardGlow 1.6s ease-in-out infinite;
  }
  @keyframes cardGlow{
    0%,100%{box-shadow:0 0 26px rgba(255,197,61,.28),0 16px 40px rgba(0,0,0,.5)}
    50%{box-shadow:0 0 52px rgba(255,197,61,.55),0 16px 40px rgba(0,0,0,.5)}
  }
  .card-back .qm{
    font-family:'Mitr',sans-serif;font-weight:600;font-size:84px;color:var(--gold);
    text-shadow:0 0 24px rgba(255,197,61,.6);
    animation:qmFloat 2s ease-in-out infinite;
  }
  @keyframes qmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .card-back .tap-hint{
    font-family:'Mitr',sans-serif;font-weight:500;font-size:19px;color:#CFE9F8;
    animation:blink 1.2s step-end infinite;
  }
  .card-back .deco{position:absolute;font-size:20px;opacity:.35;}
  .card-front{
    transform:rotateY(180deg);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:linear-gradient(170deg,#FFFFFF,#EAF6FF);
    border:3px solid var(--gold);
    color:var(--ink);
    padding:18px 18px 16px;
    display:flex;flex-direction:column;
    box-shadow:0 16px 44px rgba(0,0,0,.45);
  }
  .w-tier{
    align-self:flex-start;
    font-family:'Mitr',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:1px;
    background:var(--ink);color:var(--gold);
    padding:4px 12px;border-radius:999px;margin-bottom:8px;
  }
  .w-ic{font-size:40px;line-height:1;margin-bottom:4px;}
  .w-name{
    font-family:'Mitr',sans-serif;font-weight:600;font-size:25px;line-height:1.25;
    color:#0E6FA8;
  }
  .w-alias{font-size:15px;color:#3D566E;margin:2px 0 8px;font-weight:500;}
  .w-price{
    display:flex;align-items:baseline;gap:8px;margin-bottom:10px;
    font-family:'Mitr',sans-serif;flex-wrap:wrap;
  }
  .w-price .num{font-weight:600;font-size:28px;color:var(--cta-deep);}
  .w-price .unit{font-size:13.5px;color:#3D566E;font-weight:400;}
  .w-points{list-style:none;margin-bottom:10px;}
  .w-points li{
    display:flex;gap:8px;align-items:center;
    font-size:16px;font-weight:500;line-height:1.45;margin-bottom:5px;
  }
  .w-points li::before{content:"✔";color:var(--ok);font-weight:700;}
  .w-sub{
    background:#F0F7FC;border:1.5px dashed #A8CDE4;border-radius:12px;
    padding:9px 12px;margin-bottom:10px;
    font-size:13.5px;line-height:1.5;color:#22506F;
  }
  .w-sub b{font-family:'Mitr',sans-serif;font-weight:600;}
  .w-ctas{display:flex;flex-direction:column;gap:8px;margin-top:auto;}
  .w-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:13px;padding:12px;
    font-family:'Mitr',sans-serif;font-weight:600;font-size:17px;
    cursor:pointer;text-decoration:none;
    transition:transform .12s ease;
  }
  .w-btn:active{transform:scale(.97);}
  .w-btn.line{
    background:linear-gradient(180deg,#21C063,#12994A);color:#fff;
    box-shadow:0 5px 14px rgba(24,160,94,.4);
  }
  .w-btn.page{
    background:#fff;border:2px solid #0E6FA8;color:#0E6FA8;
  }
  .confetti{
    position:absolute;top:40%;left:50%;font-size:18px;opacity:0;
    pointer-events:none;z-index:12;
    animation:confettiFly .9s ease-out forwards;
  }
  @keyframes confettiFly{
    0%{transform:translate(-50%,-50%);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(.5);opacity:0}
  }
  .reveal-foot{
    margin-top:18px;z-index:11;display:flex;gap:18px;
    opacity:0;animation:fadeUp .4s .2s ease forwards;
  }
  .reveal-foot button{
    background:none;border:none;cursor:pointer;
    color:#9FC6DD;font-family:'Mitr',sans-serif;font-weight:500;font-size:16px;
    padding:8px 10px;
  }
  .reveal-foot button.alt{
    border:1.5px solid var(--aqua);border-radius:999px;
    color:#EAF6FF;padding:9px 18px;
  }
  .reveal-foot button.alt:active{background:rgba(69,198,240,.15);}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);
    background:rgba(255,255,255,.96);color:var(--ink);
    font-family:'Mitr',sans-serif;font-size:15.5px;font-weight:600;
    padding:11px 24px;border-radius:999px;
    opacity:0;pointer-events:none;transition:all .3s ease;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    *{animation-delay:0s !important;animation-duration:.01ms !important;transition-duration:.01ms !important;}
    .card3d{transition-duration:.01ms;}
    .falling-drop{top:calc(52% - 44px);}
    .title-mascot{transform:none;}
    .presents,.game-title,.press-start{opacity:1;transform:none;}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ================= SCREEN 1 : TITLE ================= -->
  <section class="screen active" id="scrTitle" style="align-items:center;justify-content:center;">
    <button class="chip-btn right" id="skipIntro">ข้าม »</button>

    <svg class="falling-drop" viewBox="0 0 34 44">
      <path d="M17 2 q13 17 13 26 a13 13 0 1 1 -26 0 q0 -9 13 -26z" fill="#45C6F0" stroke="#8FD8FF" stroke-width="2"/>
    </svg>
    <div class="splash-ring"></div>
    <div class="splash-ring r2"></div>
    <span class="spark" style="--sx:-52px;--sy:-38px">💧</span>
    <span class="spark" style="--sx:48px;--sy:-46px">💧</span>
    <span class="spark" style="--sx:-20px;--sy:-60px">💧</span>
    <span class="spark" style="--sx:26px;--sy:-24px">💧</span>

    <div class="title-mascot">
      <svg viewBox="0 0 100 110">
        <g class="mascot-idle" id="titleMascotBody">
          <path d="M50 14 q30 34 30 55 a30 30 0 1 1 -60 0 q0 -21 30 -55z" fill="#2FA8E8" stroke="#0E6FA8" stroke-width="3"/>
          <path d="M36 52 q-6 14 2 26" stroke="#8FD8FF" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
          <circle cx="41" cy="56" r="4" fill="#071B33"/><circle cx="61" cy="56" r="4" fill="#071B33"/>
          <circle cx="42.5" cy="54.5" r="1.4" fill="#fff"/><circle cx="62.5" cy="54.5" r="1.4" fill="#fff"/>
          <path d="M43 68 q8 8 16 0" stroke="#071B33" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="33" cy="64" rx="4.5" ry="3" fill="#FF9DB0" opacity=".55"/>
          <ellipse cx="69" cy="64" rx="4.5" ry="3" fill="#FF9DB0" opacity=".55"/>
          <g class="arm-wave">
            <path d="M78 62 q13 -7 15 -18" stroke="#0E6FA8" stroke-width="6" fill="none" stroke-linecap="round"/>
            <circle cx="94" cy="42" r="6" fill="#2FA8E8" stroke="#0E6FA8" stroke-width="2.5"/>
          </g>
          <g class="hat">
            <path d="M28 34 a22 16 0 0 1 44 0 z" fill="#FFC53D" stroke="#C98F00" stroke-width="2.5"/>
            <rect x="24" y="32" width="52" height="7" rx="3.5" fill="#FFC53D" stroke="#C98F00" stroke-width="2.5"/>

/* ================================================================
   TRACKING — ต่อเข้า track.js / Meta Pixel ตอนขึ้น production
   ================================================================ */
function track(ev){
  try{ if(window.fbq) fbq("trackCustom", "Finder_"+ev); }catch(e){}
}

/* ================================================================
   ENGINE
   ================================================================ */
const $ = id => document.getElementById(id);
const toast = $("toast");
const vib = ms => navigator.vibrate?.(ms);

let state = { zone:null, answers:[], card:null };
let nav = [];   // stack ของคำถามที่ผ่านมา: {qid, ansLen} — ใช้ย้อนกลับได้ทุกชั้น

function goBack(){
  vib(15);
  if(nav.length){
    const prev = nav[nav.length-1];
    state.answers = state.answers.slice(0, prev.ansLen);
    renderQuestion(prev.qid);
  } else {
    state.answers = [];
    showScreen("scrHouse");
    houseTyper.type("จิ้มจุดที่มีปัญหาได้เลยครับ 👇");
  }
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
}
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"), 1800);
}

/* ---------- typewriter ---------- */
function makeTyper(txtEl, bodyEl){
  let timer = null, done = true, current = "";
  const api = {
    type(str, speed=30){
      clearInterval(timer); done = false; current = str;
      txtEl.textContent = "";
      if(bodyEl) bodyEl.style.animation = "talkB .3s ease-in-out infinite";
      let i = 0;
      timer = setInterval(()=>{
        txtEl.textContent = str.slice(0, ++i);
        if(i >= str.length) api.finish();
      }, speed);
    },
    finish(){
      clearInterval(timer);
      txtEl.textContent = current;
      if(bodyEl) bodyEl.style.animation = "";
      done = true;
    },
    get done(){ return done; }
  };
  return api;
}

/* ================================================================
   PHASE 1 : TITLE + INTRO BEATS
   ================================================================ */
const scrTitle = $("scrTitle");
for(let i=0;i<10;i++){
  const b = document.createElement("div");
  b.className = "bubble";
  const s = 6 + Math.random()*16;
  b.style.width = b.style.height = s+"px";
  b.style.left = (Math.random()*95)+"%";
  b.style.animationDuration = (7+Math.random()*8)+"s";
  b.style.animationDelay = (Math.random()*8)+"s";
  scrTitle.appendChild(b);
}

const titleTyper = makeTyper($("titleDlgTxt"), $("titleMascotBody"));
let titlePhase = "title", beat = 0;

scrTitle.addEventListener("click", (e)=>{
  if(e.target.id === "skipIntro") return;
  if(titlePhase === "title"){
    titlePhase = "beats";
    $("pressStart").style.display = "none";
    $("titleDlg").style.display = "block";
    vib(20);
    track("start");
    titleTyper.type(INTRO_BEATS[0]);
  } else if(titlePhase === "beats"){
    if(!titleTyper.done){ titleTyper.finish(); return; }
    beat++;
    if(beat < INTRO_BEATS.length) titleTyper.type(INTRO_BEATS[beat]);
    else goHouse();
  }
});
$("skipIntro").addEventListener("click", ()=>{ track("skip_intro"); goHouse(); });

function goHouse(){
  titlePhase = "done";
  vib(25);
  showScreen("scrHouse");
  houseTyper.type("บ้านหลังนี้แหละครับ! จิ้มจุดที่มีปัญหาเลย 👇");
}

/* ================================================================
   PHASE 2 : HOUSE
   ================================================================ */
const houseTyper = makeTyper($("houseDlgTxt"), $("houseMascotBody"));
const goBtn = $("goBtn");
let pendingZone = null;

function splashAt(x, y){
  for(let k=0;k<5;k++){
    const s = document.createElement("div");
    s.className = "splash";
    s.textContent = "💧";
    s.style.left = x+"px"; s.style.top = y+"px";
    s.style.setProperty("--dx", (Math.random()*80-40)+"px");
    s.style.setProperty("--dy", (-30-Math.random()*50)+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 650);
  }
}

document.querySelectorAll(".hs").forEach(h=>{
  h.addEventListener("click", (e)=>{
    vib(25);
    splashAt(e.clientX ?? innerWidth/2, e.clientY ?? innerHeight/2);
    pickZone(h.dataset.zone);
  });
});
$("otherChip").addEventListener("click", ()=>{ vib(20); pickZone("other"); });

function pickZone(z){
  pendingZone = z;
  const zone = ZONES[z];
  state.zone = z;
  state.answers = [zone.label];
  nav = [];
  track("pick_"+z);
  goBtn.classList.remove("show");
  if(zone.react){
    houseTyper.type(zone.react);
    setTimeout(()=> goBtn.classList.add("show"), 500);
  } else {
    proceedFromZone();
  }
}
goBtn.addEventListener("click", proceedFromZone);

function proceedFromZone(){
  const zone = ZONES[pendingZone];
  goBtn.classList.remove("show");
  if(zone.q) showQuestion(zone.q);
  else showReveal(zone.card);
}

/* ================================================================
   PHASE 3 : QUESTION
   ================================================================ */
function showQuestion(qid){
  nav.push({ qid, ansLen: state.answers.length });
  renderQuestion(qid);
}
function renderQuestion(qid){
  const q = QUESTIONS[qid];
  $("qTitle").textContent = q.title;
  const box = $("qOpts");
  box.innerHTML = "";
  q.opts.forEach(o=>{
    const b = document.createElement("button");
    b.className = "q-opt";
    b.innerHTML = `<span class="ic">${o.ic}</span><span>${o.lb}</span>`;
    b.onclick = ()=>{
      vib(25);
      [...box.children].forEach(c=>{ if(c!==b) c.classList.add("dimmed"); });
      b.classList.add("picked");
      state.answers.push(o.lb);
      track("answer");
      setTimeout(()=>{
        if(o.q) showQuestion(o.q);
        else showReveal(o.card);
      }, 380);
    };
    box.appendChild(b);
  });
  showScreen("scrQuestion");
}
$("qBack").addEventListener("click", ()=>{
  nav.pop();          // ทิ้งคำถามปัจจุบัน
  goBack();           // กลับไปคำถามก่อนหน้า หรือฉากบ้าน
});

/* ================================================================
   PHASE 4 : REVEAL (gacha)
   ================================================================ */
const card3d = $("card3d");
let revealed = false;

function showReveal(cardId){
  state.card = cardId;
  revealed = false;
  card3d.classList.remove("flipped");
  $("rays").classList.remove("on");
  $("revealFoot").style.display = "none";
  buildCardFront(CARDS[cardId]);
  showScreen("scrReveal");
  track("reveal_"+cardId);
}

function buildCardFront(c){
  $("cardFront").innerHTML = `
    <div class="w-tier">${c.tier}</div>
    <div class="w-ic">${c.ic}</div>
    <div class="w-name">${c.name}</div>
    <div class="w-alias">${c.alias}</div>
    <div class="w-price"><span class="num">${c.price}</span><span class="unit">${c.unit}</span></div>
    <ul class="w-points">${c.points.map(p=>`<li>${p}</li>`).join("")}</ul>
    ${c.sub ? `<div class="w-sub">${c.sub}</div>` : ""}
    <div class="w-ctas">
      <button class="w-btn line" id="lineBtn">💬 คัดลอกข้อมูล + ทัก LINE</button>
      <a class="w-btn page" href="${c.url}" target="_blank" rel="noopener">${c.pageLabel || "ดูหน้าสินค้า →"}</a>
    </div>`;
  $("lineBtn").onclick = (e)=>{
    e.stopPropagation();
    vib(25);
    track("cta_line");
    const msg = `สวัสดีครับ สนใจ ${c.name} ครับ\nปัญหา: ${state.answers.join(" → ")}`;
    const openLine = ()=> setTimeout(()=> window.open(LINE_URL, "_blank"), 600);
    if(navigator.clipboard?.writeText){
      navigator.clipboard.writeText(msg)
        .then(()=>{ showToast("คัดลอกแล้ว ✔ วางในแชทได้เลยครับ"); openLine(); })
        .catch(()=>{ openLine(); });
    } else openLine();
  };
  const pageBtn = $("cardFront").querySelector(".w-btn.page");
  pageBtn.addEventListener("click", (e)=>{ e.stopPropagation(); track("cta_page"); });
}

card3d.addEventListener("click", ()=>{
  if(revealed) return;
  revealed = true;
  vib(40);
  track("flip");
  card3d.classList.add("flipped");
  $("rays").classList.add("on");
  setTimeout(()=>{
    for(let k=0;k<14;k++){
      const s = document.createElement("div");
      s.className = "confetti";
      s.textContent = ["💧","✨","⭐"][k%3];
      s.style.setProperty("--dx", (Math.random()*320-160)+"px");
      s.style.setProperty("--dy", (Math.random()*-260-40)+"px");
      s.style.setProperty("--rot", (Math.random()*360)+"deg");
      $("scrReveal").appendChild(s);
      setTimeout(()=>s.remove(), 950);
    }
    $("revealFoot").style.display = "flex";
  }, 420);
});

$("rBack").addEventListener("click", ()=>{
  track("back_from_card");
  goBack();   // กลับไปคำถามล่าสุด (เผื่ออยากเปลี่ยนใจ เช่น แพงไป ขอถูกลง)
});

$("againBtn").addEventListener("click", ()=>{
  state = { zone:null, answers:[], card:null };
  nav = [];
  track("restart");
  showScreen("scrHouse");
  houseTyper.type("รอบสอง! จิ้มจุดที่มีปัญหาได้เลยครับ 👇");
});
</script>
