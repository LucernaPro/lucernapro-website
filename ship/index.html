<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Lucerna Ship — ระบบจัดส่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2A2118;
    --orange:#F07E22;
    --orange-deep:#D96A10;
    --orange-soft:#FDF3E9;
    --orange-line:#F6CFA6;
    --gray:#75695C;
    --hairline:#EFE7DC;
    --paper:#FFFFFF;
    --app-bg:#241A10;
    --ok:#3E7C4F;
    --ok-soft:#EAF5ED;
    --warn:#8A5B22;
    --warn-soft:#FBF0DF;
    --bad:#A34532;
    --bad-soft:#FBEAE5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--app-bg)}
  body{font-family:'Sarabun',-apple-system,'Noto Sans Thai',sans-serif;color:var(--ink)}

  .appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;background:var(--app-bg)}
  .appbar .brand{font-weight:600;font-size:14px;color:#F3E4D2;letter-spacing:.05em;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .brand .layers{display:inline-flex;flex-direction:column;gap:2px}
  .brand .layers i{display:block;width:14px;height:3px;border-radius:1px}
  .brand .layers i:nth-child(1){background:#FFC98A}
  .brand .layers i:nth-child(2){background:#F59B3D}
  .brand .layers i:nth-child(3){background:var(--orange-deep)}
  .appbar input[type=date]{font-family:'Sarabun';font-size:14px;padding:7px 10px;border-radius:7px;
    border:1px solid #6A4E2E;background:#1D1509;color:#F6EADB;color-scheme:dark}

  .tabs{display:flex;gap:8px;padding:0 14px 10px;background:var(--app-bg)}
  .tabs button{flex:1;font-family:'Sarabun';font-weight:600;font-size:13.5px;padding:9px 4px;border-radius:9px;
    border:1px solid #6A4E2E;background:transparent;color:#C9B294;cursor:pointer;position:relative}
  .tabs button.on{background:var(--orange);border-color:var(--orange);color:#fff}
  .tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;
    background:#00000033;font-size:11px;line-height:17px}

  .page{padding:12px 14px 90px;max-width:1100px;margin:0 auto}
  .twrap{background:var(--paper);border-radius:12px;overflow-x:auto}
  .otab{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
  .otab th{text-align:left;font-size:11.5px;color:var(--gray);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--hairline);white-space:nowrap;background:var(--orange-soft)}
  .otab td{padding:8px 12px;border-bottom:1px solid var(--hairline);vertical-align:middle}
  .otab tr:last-child td{border-bottom:none}
  .td-date{white-space:nowrap;color:var(--gray);font-variant-numeric:tabular-nums;width:1%}
  .td-cust{font-weight:600;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  .td-trk{white-space:nowrap;width:1%}
  .trkin{font-family:'Sarabun';font-size:13px;padding:6px 9px;border-radius:7px;border:1px solid var(--orange-line);background:var(--orange-soft);width:168px;letter-spacing:.02em}
  .trkin:focus{outline:none;border-color:var(--orange);background:#fff}
  .tok{color:var(--ok);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
  .tmut{color:#B4A794;font-size:12.5px}
  tr.skipped td{opacity:.5}
  .card{background:var(--paper);border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid transparent}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .cust{font-weight:600;font-size:15px}
  .sub{font-size:12px;color:var(--gray);margin-top:1px}
  .items{margin-top:8px;border-top:1px solid var(--hairline);padding-top:7px;font-size:13px;line-height:1.75}
  .items b{font-weight:400;color:var(--gray);font-variant-numeric:tabular-nums}
  .chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .chip.wait{background:var(--warn-soft);color:var(--warn)}
  .chip.done{background:var(--ok-soft);color:var(--ok)}
  .trackno{font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .mini{font-family:'Sarabun';font-weight:600;font-size:12px;border:none;border-radius:7px;padding:6px 11px;cursor:pointer}
  .mini.orange{background:var(--orange);color:#fff}
  .mini.ghost{background:transparent;color:var(--gray);border:1px solid var(--hairline)}
  .mini.red{background:transparent;color:var(--bad);border:1px solid #E7C4BA}

  .pastebox{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .pastebox textarea{width:100%;min-height:130px;resize:vertical;font-family:'Sarabun';font-size:14px;line-height:1.7;
    background:#1A1209;color:#F6EADB;border:1px dashed #7A5836;border-radius:10px;padding:12px 14px}
  .pastebox textarea::placeholder{color:#8A7458}
  .pastebox textarea:focus{outline:none;border-color:var(--orange)}
  .btn-parse{align-self:flex-end;font-family:'Sarabun';font-weight:600;font-size:14px;background:var(--orange);
    color:#fff;border:none;border-radius:8px;padding:9px 18px;cursor:pointer}
  .btn-parse:active{background:var(--orange-deep)}
  .btn-parse[disabled]{opacity:.55}

  .m-card{border-left:4px solid var(--hairline)}
  .m-card.ok{border-left-color:var(--ok)}
  .m-card.ask{border-left-color:var(--warn)}
  .m-card.none{border-left-color:var(--bad)}
  .m-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .m-track{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .m-name{font-size:13px;color:var(--gray)}
  .tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px}
  .tag.ok{background:var(--ok-soft);color:var(--ok)}
  .tag.ask{background:var(--warn-soft);color:var(--warn)}
  .tag.none{background:var(--bad-soft);color:var(--bad)}
  .m-body{margin-top:8px;font-size:13.5px}
  .m-body select{width:100%;font-family:'Sarabun';font-size:14px;padding:9px 10px;border-radius:8px;
    border:1px solid var(--orange-line);background:var(--orange-soft);color:var(--ink);margin-top:6px}
  .pairline{display:flex;align-items:center;gap:8px}
  .pairline label{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;flex:1}
  .pairline input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange);flex:none}
  .arrow{color:var(--orange-deep);font-weight:600}

  .confirmbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--app-bg);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;justify-content:center}
  .confirmbar button{width:min(612px,100%);font-family:'Sarabun';font-weight:600;font-size:15px;
    background:var(--orange);color:#fff;border:none;border-radius:10px;padding:13px;cursor:pointer}
  .confirmbar button:active{background:var(--orange-deep)}
  .confirmbar button[disabled]{opacity:.55}

  .empty{color:#A08B72;font-size:13.5px;text-align:center;padding:30px 10px}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:100;background:#111;color:#fff;
    font-size:13.5px;padding:10px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.25s;max-width:88vw}
  .toast.show{opacity:.94}

  #pinModal{display:none;position:fixed;inset:0;background:rgba(10,6,2,.8);z-index:200;align-items:center;justify-content:center}
  #pinModal .box{background:#2E2213;border:1px solid #6A4E2E;border-radius:14px;padding:22px 20px;width:min(320px,86vw)}
  #pinModal .t{font-size:15px;font-weight:600;color:#F0D9BC;margin-bottom:4px}
  #pinModal .s{font-size:12.5px;color:#A08B72;margin-bottom:12px}
  #pinInput{width:100%;font-family:'Sarabun';font-size:17px;letter-spacing:.2em;padding:10px 12px;border-radius:8px;
    border:1px solid #6A4E2E;background:#1D1509;color:#F6EADB;text-align:center}
  #pinModal .row{display:flex;gap:10px;margin-top:14px}
  #pinModal button{flex:1;font-family:'Sarabun';font-weight:600;font-size:14px;padding:10px;border-radius:8px;cursor:pointer}
  #pinOk{border:none;background:var(--orange);color:#fff}
  #pinCancel{border:1px solid #6A4E2E;background:transparent;color:#D9C6AE}
</style>
</head>
<body>

<div class="appbar">
  <div class="brand"><span class="layers"><i></i><i></i><i></i></span> LUCERNA · จัดส่ง <span style="font-weight:400;font-size:10px;color:#8A7458">v6</span></div>
  <div style="display:flex;gap:8px;align-items:center">
    <button id="btnSync" style="font-family:'Sarabun';font-weight:600;font-size:13px;padding:7px 12px;border-radius:7px;border:1px solid #7A5836;background:transparent;color:#F3C186;cursor:pointer">⟳ ดึงข้อมูล</button>
    <input type="date" id="datePick">
  </div>
</div>

<div class="tabs">
  <button data-tab="day" class="on">รายการวัน</button>
  <button data-tab="match">กรอกเลข EMS</button>
  <button data-tab="pending">ค้างส่ง<span class="cnt" id="cntPending">0</span></button>
  <button data-tab="orphan">เลขลอย<span class="cnt" id="cntOrphan">0</span></button>
</div>

<div class="page">
  <div id="tab-day"></div>

  <div id="tab-match" style="display:none">
    <div class="pastebox">
      <textarea id="emsText" placeholder="วางลิสต์จากไปรษณีย์ตรงนี้ เช่น&#10;ED458656595TH   อภิวิชญ์&#10;ED458656604TH   อรรนพ&#10;..."></textarea>
      <button class="btn-parse" id="btnParse">ตรวจ + จับคู่</button>
    </div>
    <div id="matchResults"></div>
  </div>

  <div id="tab-pending" style="display:none"></div>
  <div id="tab-orphan" style="display:none"></div>
</div>

<div class="confirmbar" id="confirmBar"><button id="btnConfirm">บันทึกผลจับคู่</button></div>
<div class="toast" id="toast"></div>
<datalist id="dlOrphans"></datalist>

<div id="pinModal">
  <div class="box">
    <div class="t">รหัสระบบจัดส่ง</div>
    <div class="s">ใส่ครั้งแรกครั้งเดียว เครื่องนี้จะจำไว้</div>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off">
    <div class="row">
      <button id="pinCancel">ยกเลิก</button>
      <button id="pinOk">ตกลง</button>
    </div>
  </div>
</div>

<script>
const API = { url: 'https://lucerna-ship.lekvtwin.workers.dev' };
const OPEN_MODE = true; /* ชั่วคราว: ไม่ถาม PIN — เปลี่ยนเป็น false เมื่อเปิดระบบ security */

/* ---------- PIN (pattern เดียวกับ /account) ---------- */
function getPin(){ try{ return localStorage.getItem('ship_pin'); }catch(e){ return null; } }
function storePin(p){ try{ localStorage.setItem('ship_pin', p); }catch(e){} }
function clearPin(){ try{ localStorage.removeItem('ship_pin'); }catch(e){} }
function askPin(){
  return new Promise(res=>{
    const m=document.getElementById('pinModal'), inp=document.getElementById('pinInput');
    m.style.display='flex'; inp.value=''; setTimeout(()=>inp.focus(),50);
    document.getElementById('pinOk').onclick=()=>{ m.style.display='none'; res(inp.value.trim()||null); };
    document.getElementById('pinCancel').onclick=()=>{ m.style.display='none'; res(null); };
  });
}
async function api(path, body){
  let pin=getPin(), asked=false;
  if(OPEN_MODE){ pin='open'; asked=false; }
  else if(!pin){ pin=await askPin(); asked=true; if(!pin) return {error:'ไม่ได้ใส่ PIN'}; }
  try{
    const r=await fetch(API.url.replace(/\/$/,'')+path, body
      ? {method:'POST',headers:{'content-type':'application/json','x-pin':pin},body:JSON.stringify(body)}
      : {headers:{'x-pin':pin}});
    if(r.status===401){ clearPin(); toast('PIN ไม่ถูกต้อง — ลองใหม่'); return {error:'PIN'}; }
    if(asked) storePin(pin);
    return await r.json();
  }catch(e){ return {error:e.message}; }
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600);
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const thDate=iso=>{ const [y,m,d]=iso.split('-'); return `${+d}/${+m}/${y}`; };
const qtyFmt=q=>(+q)%1===0?(+q).toFixed(0):(+q);

/* ---------- tabs ---------- */
let curTab='day';
document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick=()=>{
    curTab=b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
    ['day','match','pending','orphan'].forEach(t=>document.getElementById('tab-'+t).style.display=(t===curTab)?'':'none');
    document.getElementById('confirmBar').style.display=(curTab==='match'&&matchData.length)?'flex':'none';
    if(t_load[curTab]) t_load[curTab]();
  };
});

/* ---------- รายการวัน ---------- */
const datePick=document.getElementById('datePick');
{const _n=new Date();datePick.value=`${_n.getFullYear()}-${String(_n.getMonth()+1).padStart(2,'0')}-${String(_n.getDate()).padStart(2,'0')}`;}
datePick.onchange=()=>loadDay();

function fmtItems(g){return g.items.map(i=>`${i.product} ×${qtyFmt(i.qty)}`).join(', ');}
function tableFor(groups, emptyMsg){
  if(!groups.length) return `<div class="empty">${emptyMsg}</div>`;
  const rows=groups.map(g=>{
    let trk='';
    if(g.status==='shipped')
      const toks=(g.tracking||'').split(/\s+/).filter(Boolean)
        .map(t=>`<div class="tok">✓ ${esc(t)}</div>`).join('');
      trk=`<span style="display:inline-block;vertical-align:middle;text-align:left">${toks}</span> <button class="mini ghost" onclick="addTrk(${g.gid},this)">+เลข</button> <button class="mini red" onclick="unassign(${g.gid})">ถอน</button>`;
    else if(g.status==='skipped')
      trk=`<span class="tmut">ตัดออก (ไม่ส่ง ปณ)</span> <button class="mini ghost" onclick="unskipG(${g.gid})">คืน</button>`;
    else
      trk=`<input class="trkin" list="dlOrphans" placeholder="EDxxxxxxxxxTH" onkeydown="if(event.key==='Enter')saveTrk(${g.gid},this)">`+
          `<button class="mini orange" onclick="saveTrk(${g.gid},this.closest('td').querySelector('input.trkin'))" style="margin-left:6px">บันทึก</button>`+
          `<button class="mini ghost" onclick="skipG(${g.gid})" style="margin-left:6px" title="ออเดอร์ที่ไม่ได้ส่งทางไปรษณีย์ เช่น Shopee/Lazada">ตัด</button>`;
    return `<tr class="${g.status}"><td class="td-date">${thDate(g.odate)}</td>`+
           `<td class="td-cust" title="${esc(g.customer)}">${esc(g.customer)}${g.receiver?`<div style="font-weight:400;font-size:11.5px;color:var(--gray)">ผู้รับ: ${esc(g.receiver)}</div>`:''}</td>`+
           `<td>${esc(fmtItems(g))}</td><td class="td-trk">${trk}</td></tr>`;
  }).join('');
  return `<div class="twrap"><table class="otab"><thead><tr>`+
         `<th>วันที่</th><th>ลูกค้า</th><th>รายการสินค้า</th><th>เลขพัสดุ</th>`+
         `</tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function loadDay(){
  const box=document.getElementById('tab-day');
  box.innerHTML='<div class="empty">กำลังโหลด…</div>';
  const r=await api('/orders?date='+datePick.value);
  if(r.error){ box.innerHTML=`<div class="empty">${esc(r.error)}</div>`; return; }
  box.innerHTML=tableFor(r.groups,'ยังไม่มีออเดอร์ของวันนี้ในระบบ — กด ⟳ ดึงข้อมูล');
}

async function loadPending(){
  const box=document.getElementById('tab-pending');
  box.innerHTML='<div class="empty">กำลังโหลด…</div>';
  const r=await api('/pending');
  if(r.error){ box.innerHTML=`<div class="empty">${esc(r.error)}</div>`; return; }
  window._pending=r.groups;
  document.getElementById('cntPending').textContent=r.groups.length;
  box.innerHTML=tableFor(r.groups,'ไม่มีของค้างส่ง 🎉');
}

async function saveTrk(gid,inp){
  const tr=((inp&&inp.value)||'').replace(/\s+/g,'').toUpperCase();
  if(!tr){ toast('พิมพ์เลขพัสดุก่อน'); inp.focus(); return; }
  const isEms=/^[A-Z]{2}\d{9}TH$/.test(tr);           // เลขไปรษณีย์เต็มรูป
  const isOther=/^[A-Z0-9-]{6,25}$/.test(tr)&&/\d{3,}/.test(tr)&&!/TH$/.test(tr); // เลขจริงขนส่งเจ้าอื่น (BS/Flash/Kerry)
  if(!/\d{3,}/.test(tr)){ toast('ต้องเป็นเลขจริงจากขนส่ง — ยังไม่มีเลข = ยังไม่ส่ง ปล่อยค้างไว้เพื่อตามงาน'); inp.focus(); return; }
  if(!isEms&&!isOther&&!confirm('รูปแบบเลขดูแปลก ๆ — ยืนยันใช้ "'+tr+'" ?')) return;
  const r=await api('/assign',{tracking:tr,gid});
  if(r.error) toast(r.error); else { toast('บันทึกแล้ว: '+r.customer); refreshAll(); }
}
function addTrk(gid,btn){
  /* เปิดช่องกรอกในแถวเดิม — ได้ dropdown เลขลอย (datalist) เหมือนช่องปกติ และพิมพ์มือได้ */
  const td=btn.closest('td');
  td.innerHTML=`<input class="trkin" list="dlOrphans" placeholder="เลขกล่องถัดไป" onkeydown="if(event.key==='Enter')saveTrk(${gid},this)">`+
    `<button class="mini orange" onclick="saveTrk(${gid},this.closest('td').querySelector('input.trkin'))" style="margin-left:6px">บันทึก</button>`+
    `<button class="mini ghost" onclick="refreshAll()" style="margin-left:6px">ยกเลิก</button>`;
  td.querySelector('input').focus();
}
async function skipG(gid){
  if(!confirm('ตัดออเดอร์นี้ออกจากรายการจริงไหม?\n(ใช้กับออเดอร์ที่ไม่ส่งทางไปรษณีย์ — กดคืนได้ทีหลัง)')) return;
  const r=await api('/skip',{gid});
  if(r.error) toast(r.error); else { toast('ตัดออกแล้ว'); refreshAll(); }
}
async function unskipG(gid){
  const r=await api('/unskip',{gid});
  if(r.error) toast(r.error); else { toast('คืนเข้ารายการแล้ว'); refreshAll(); }
}
async function unassign(gid){
  if(!confirm('ถอนเลขพัสดุออกจากออเดอร์นี้?')) return;
  const r=await api('/unassign',{gid});
  if(r.error) toast(r.error); else { toast('ถอนเลขแล้ว'); refreshAll(); }
}

/* ---------- เลขลอย ---------- */
async function loadOrphan(){
  const box=document.getElementById('tab-orphan');
  box.innerHTML='<div class="empty">กำลังโหลด…</div>';
  const [ro]=await Promise.all([api('/orphans'),loadPickSources()]);
  if(ro.error){ box.innerHTML=`<div class="empty">${esc(ro.error)}</div>`; return; }
  document.getElementById('cntOrphan').textContent=ro.orphans.length;
  document.getElementById('dlOrphans').innerHTML=ro.orphans.map(o=>`<option value="${esc(o.tracking)}">${esc(o.ems_name)}</option>`).join('');
  if(!ro.orphans.length){ box.innerHTML='<div class="empty">ไม่มีเลขลอยค้างอยู่</div>'; return; }
  box.innerHTML=ro.orphans.map(o=>{
    const opts=pickOptions();
    return `<div class="card m-card ask">
      <div class="m-head"><span class="m-track">${esc(o.tracking)}</span>
        ${o.ems_name?`<span class="m-name">${esc(o.ems_name)}</span>`:''}
        <span class="tag ask">รอจับคู่</span></div>
      <div class="m-body">
        <select id="orph-${o.id}"><option value="">— เลือกออเดอร์ที่ตรงกัน —</option>${opts}</select>
        <div style="display:flex;gap:8px;margin-top:9px">
          <button class="mini orange" onclick="orphanAssign(${o.id},'${esc(o.tracking)}')">จับคู่</button>
          <button class="mini red" onclick="orphanArchive(${o.id})">ตัดทิ้ง (ของเก่า/ส่งไปแล้ว)</button>
        </div>
      </div></div>`;
  }).join('');
}
async function orphanAssign(id,tracking){
  const sel=document.getElementById('orph-'+id);
  if(!sel.value){ toast('เลือกออเดอร์ก่อน'); return; }
  const r=await api('/assign',{tracking,gid:+sel.value,orphan_id:id});
  if(r.error) toast(r.error); else { toast('จับคู่แล้ว: '+r.customer); refreshAll(); }
}
async function orphanArchive(id){
  if(!confirm('ตัดเลขนี้ทิ้ง? (ใช้กับของที่ส่งไปแล้วก่อนเริ่มระบบ)')) return;
  const r=await api('/orphan-archive',{id});
  if(r.error) toast(r.error); else { toast('ตัดทิ้งแล้ว'); loadOrphan(); }
}

/* ---------- จับคู่ EMS ---------- */
let matchData=[];
document.getElementById('btnParse').onclick=async()=>{
  const btn=document.getElementById('btnParse');
  btn.disabled=true;
  const r=await api('/parse-match',{text:document.getElementById('emsText').value});
  btn.disabled=false;
  if(r.error){ toast(r.error); return; }
  await loadPickSources();
  matchData=r.results;
  renderMatch();
};

function candLabel(g){ return `${g.customer} — ${thDate(g.odate)} (${g.items.map(i=>i.product).join(', ').slice(0,40)})`; }
function pickOptions(){
  /* dropdown เลือกเอง: ค้างส่งทั้งหมด (จับคู่แล้ว/ตัดแล้วไม่ขึ้น — เหลือน้อยอยู่แล้ว)
     + กลุ่มที่ส่งแล้ว 2 วันล่าสุด สำหรับเพิ่มกล่อง/เลขเอกสาร */
  const p=(window._pendingAll||[]).map(g=>`<option value="${g.gid}">${esc(candLabel(g))}</option>`).join('');
  const sh=(window._recent||[]).filter(g=>g.status==='shipped').map(g=>`<option value="${g.gid}">เพิ่มกล่อง: ${esc(g.customer)} ✓${esc((g.tracking||'').split(' ')[0])}</option>`).join('');
  return p+(sh?`<optgroup label="— ส่งแล้ว (เพิ่มเลขให้ออเดอร์เดิม) —">${sh}</optgroup>`:'');
}
async function loadPickSources(){
  const [rp,rr]=await Promise.all([api('/pending'),api('/recent')]);
  window._pendingAll=rp.groups||[];
  window._recent=(rr&&!rr.error&&rr.groups)||[]; /* worker เก่ายังไม่มี /recent → ข้ามหมวดส่งแล้วไปก่อน */
}

function renderMatch(){
  const box=document.getElementById('matchResults');
  box.innerHTML=matchData.map((m,i)=>{
    if(m.reason==='already_used'){
      return `<div class="card m-card"><div class="m-head">
        <span class="m-track">${esc(m.tracking)}</span><span class="m-name">${esc(m.ems_name)}</span>
        <span class="tag ask">เลขนี้ใช้ไปแล้ว (${esc(m.used_by)})</span></div></div>`;
    }
    if(m.match){
      const tag=m.reason==='exact'?'ชื่อตรง':'ชื่อขึ้นต้นตรง';
      return `<div class="card m-card ok"><div class="pairline">
        <label><input type="checkbox" data-i="${i}" checked>
          <span><span class="m-track">${esc(m.tracking)}</span> <span class="m-name">${esc(m.ems_name)}</span><br>
          <span class="arrow">→</span> <b style="font-weight:600">${esc(m.match.customer)}</b>
          <span class="m-name">${thDate(m.match.odate)} · ${esc(m.match.items.map(x=>x.product).join(', ').slice(0,50))}</span></span></label>
        <span class="tag ok">${tag}</span></div></div>`;
    }
    const opts=(m.candidates&&m.candidates.length)
      ? m.candidates.map(g=>`<option value="${g.gid}">${esc(candLabel(g))}</option>`).join('')
      : pickOptions();
    const tag=m.reason==='ambiguous'?'<span class="tag ask">เจอหลายคน — เลือกเอง</span>':'<span class="tag none">ไม่เจอคู่</span>';
    return `<div class="card m-card ${m.reason==='ambiguous'?'ask':'none'}">
      <div class="m-head"><span class="m-track">${esc(m.tracking)}</span>
        <span class="m-name">${esc(m.ems_name)}</span>${tag}</div>
      <div class="m-body">
        <select data-sel="${i}">
          <option value="">— เลือกออเดอร์เอง —</option>${opts}
          <option value="__keep">◌ เก็บเป็น "เลขลอย" ไว้ก่อน</option>
          <option value="__drop">✕ ตัดทิ้ง (ของเก่าที่ส่งไปแล้ว)</option>
        </select>
      </div></div>`;
  }).join('') || '<div class="empty">ไม่พบเลข tracking ในข้อความ</div>';
  document.getElementById('confirmBar').style.display=matchData.length?'flex':'none';
}

document.getElementById('btnConfirm').onclick=async()=>{
  const assigns=[], orphans=[];
  matchData.forEach((m,i)=>{
    if(m.reason==='already_used') return;
    if(m.match){
      const cb=document.querySelector(`input[data-i="${i}"]`);
      if(cb&&cb.checked) assigns.push({tracking:m.tracking,gid:m.match.gid,auto:true});
      return;
    }
    const sel=document.querySelector(`select[data-sel="${i}"]`);
    const v=sel?sel.value:'';
    if(v==='__keep') orphans.push({tracking:m.tracking,ems_name:m.ems_name,action:'keep'});
    else if(v==='__drop') orphans.push({tracking:m.tracking,ems_name:m.ems_name,action:'archive'});
    else if(v) assigns.push({tracking:m.tracking,gid:+v,auto:false});
    else orphans.push({tracking:m.tracking,ems_name:m.ems_name,action:'keep'}); /* ไม่เลือก = เก็บเป็นเลขลอย ไม่หายเงียบ */
  });
  const btn=document.getElementById('btnConfirm'); btn.disabled=true;
  const r=await api('/confirm',{assigns,orphans});
  btn.disabled=false;
  if(r.error){ toast(r.error); return; }
  toast(`บันทึกแล้ว: จับคู่ ${r.saved} · เลขลอย ${r.orphaned}`);
  matchData=[]; document.getElementById('emsText').value=''; renderMatch();
  refreshAll();
};

const t_load={day:loadDay,pending:loadPending,orphan:loadOrphan};
function refreshAll(){ loadDay(); loadPending(); loadOrphan(); }
document.getElementById('btnSync').onclick=async()=>{
  const b=document.getElementById('btnSync');
  b.disabled=true; b.textContent='⟳ กำลังดึง…';
  const r=await api('/sync',{});
  b.disabled=false; b.textContent='⟳ ดึงข้อมูล';
  if(r.error){ toast(r.error); return; }
  toast(`ดึงข้อมูลแล้ว: ใหม่ ${r.added} / อัพเดต ${r.updated}`);
  refreshAll();
};
refreshAll();
</script>
